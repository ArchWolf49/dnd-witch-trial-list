<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Witch Trial Evidence</title>

<style>

@font-face {
    font-family: 'EnchantedLand';
    src: url('fonts/EnchantedLand.otf') format('opentype');
}

body{
    background:#d6c3a0;
    color:#3d2d1c;
    text-align:center;
    font-family:'EnchantedLand', serif;
    padding:20px;
}

h1{
    margin-bottom:20px;
    font-size:72px;
    font-weight:normal;
    font-family:'EnchantedLand', serif;
}

img{
    max-width:90%;
    border:4px solid #999;
    margin-bottom:20px;
}

input{
    width:350px;
    padding:10px;
    font-size:18px;
    font-family:'EnchantedLand', serif;
}

button{
    padding:10px 20px;
    font-size:18px;
    font-family:'EnchantedLand', serif;
}

#message{
    margin-top:15px;
    font-size:20px;
    font-family:'EnchantedLand', serif;
}

</style>

</head>

<body>

<h1>Recovered Fragments</h1>

<img id="listImage" src="assets/stage-0.jpg">

<input
id="answerBox"
placeholder="Enter recovered fragment">

<button onclick="checkAnswer()">
Submit
</button>

<div id="message"></div>

<script>

let stage = 0;

const answers = [

["tiefling tailor visit","or visit"],

["scales for weighing","for weighing"],

["blood oranges","oranges"],

["orcs toothbrush",
"orc toothbrush",
"toothbrush",
"brush"],

["cats eyeball ointment",
"eyeball ointment",
"ointment"],

["fingers of chocolate",
"chocolate fingers",
"of chocolate"],

["three heads for mops",
"heads for mops",
"for mops",
"of mops",
"mop heads",
"mopheads",
"mops",]

];

function clean(text){

return text
.toLowerCase()
.replace(/'/g,"")
.replace(/[^a-z0-9 ]/g,"")
.trim();

}

function checkAnswer(){

console.log("Button clicked");

let input =
clean(document.getElementById("answerBox").value);

for(let answer of answers[stage]){

if(input === clean(answer)){

stage++;

document.getElementById("listImage").src =
"assets/stage-" + stage + ".jpg";

document.getElementById("message").innerHTML =
"A torn fragment fits perfectly onto the list.";

document.getElementById("answerBox").value="";

if(stage>=answers.length){

document.getElementById("message").innerHTML =
"The evidence has been completely reconstructed. The shopping list proves the accused are innocent.";

}

return;

}

}

document.getElementById("message").innerHTML =
"That fragment doesn't seem to fit.";

}

</script>

</body>
</html>
